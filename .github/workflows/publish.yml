name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Require Maven Central secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          missing=0
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add them under Settings, Secrets and variables, Actions. Names and how to create the token are in the README."
            exit 1
          fi

      - name: Build and publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${{ github.event_name }}" = "release" ] && [ "${version%-SNAPSHOT}" != "$version" ]; then
            echo "Refusing to publish a GitHub Release while gradle.properties is $version."
            echo "Set a release version, merge it, then publish the release."
            exit 1
          fi
          case "$ORG_GRADLE_PROJECT_signingInMemoryKey" in
            *"BEGIN PGP PRIVATE KEY"*) ;;
            *)
              decoded=$(printf '%s' "$ORG_GRADLE_PROJECT_signingInMemoryKey" | base64 -d)
              export ORG_GRADLE_PROJECT_signingInMemoryKey="$decoded"
              ;;
          esac
          if [ "${version%-SNAPSHOT}" != "$version" ]; then
            ./gradlew build publishToMavenCentral --no-daemon --stacktrace -PtestJavaVersion=21
          else
            ./gradlew build publishAndReleaseToMavenCentral --no-daemon --stacktrace -PtestJavaVersion=21
          fi
