name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21 to run Gradle
        id: gradle-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up JDK ${{ matrix.java }} to run tests
        id: test-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test on Java ${{ matrix.java }}
        env:
          JAVA_HOME: ${{ steps.gradle-java.outputs.path }}
        run: ./gradlew build --no-daemon --stacktrace -PtestJavaVersion=${{ matrix.java }} -Dorg.gradle.java.installations.paths=${{ steps.test-java.outputs.path }}:${{ steps.gradle-java.outputs.path }}

      - name: Publish test results
        if: always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test results (Java ${{ matrix.java }})
          files: build/test-results/**/*.xml
          comment_mode: off

      - name: Upload coverage to Codecov
        if: matrix.java == 21 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.java == 21 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: build/test-results/test/*.xml,build/test-results/integrationTest/*.xml
          fail_ci_if_error: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            build/reports/tests
            build/reports/jacoco
            build/test-results
          retention-days: 14

  quality:
    name: Format and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Spotless (changed files only)
        run: ./gradlew spotlessCheck --no-daemon --stacktrace -PtestJavaVersion=21

      - name: SpotBugs
        if: ${{ !cancelled() }}
        run: ./gradlew spotbugsMain --no-daemon --stacktrace -PtestJavaVersion=21

      - name: Upload SpotBugs SARIF to code scanning
        if: always() && hashFiles('build/reports/spotbugs/main.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/spotbugs/main.sarif
          category: spotbugs

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: build/reports/spotbugs
          retention-days: 14

  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run PIT
        run: ./gradlew pitest --no-daemon --stacktrace -PtestJavaVersion=21

      - name: Mutation summary
        if: always()
        run: |
          f=build/reports/pitest/mutations.xml
          if [ -f "$f" ]; then
            total=$(grep -c '<mutation ' "$f" || true)
            killed=$(grep -c "status='KILLED'" "$f" || true)
            survived=$(grep -c "status='SURVIVED'" "$f" || true)
            nocov=$(grep -c "status='NO_COVERAGE'" "$f" || true)
            {
              echo "### Mutation testing (PIT)"
              echo "| Total | Killed | Survived | No coverage |"
              echo "|---|---|---|---|"
              echo "| $total | $killed | $survived | $nocov |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-report
          path: build/reports/pitest
          retention-days: 14

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, integration tests and JaCoCo
        run: ./gradlew test integrationTest jacocoTestReport --no-daemon --stacktrace -PtestJavaVersion=21

      - name: Require unit and integration coverage data
        run: |
          test -s build/jacoco/test.exec
          test -s build/jacoco/integrationTest.exec
          test -s build/reports/jacoco/test/jacocoTestReport.xml
          echo "JaCoCo unit exec $(wc -c < build/jacoco/test.exec) bytes, integration exec $(wc -c < build/jacoco/integrationTest.exec) bytes"

      - name: Authenticate to SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@v1.2

      - name: Turn off Automatic Analysis
        run: |
          http=$(curl -sS -o /tmp/autoscan-body.txt -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" \
            -X POST "https://sonarcloud.io/api/autoscan/activation" \
            --data-urlencode "enable=false" \
            --data-urlencode "projectKey=sta-szek_pojo-tester")
          echo "POST /api/autoscan/activation -> HTTP ${http}"
          cat /tmp/autoscan-body.txt
          echo
          if [ "$http" != "204" ] && [ "$http" != "200" ]; then
            echo "::warning::Could not turn Automatic Analysis off (HTTP ${http}). A project admin must open Administration, then Analysis Method, and switch Automatic Analysis off. CI analysis is rejected while it stays on."
          fi

      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v8.5.1

