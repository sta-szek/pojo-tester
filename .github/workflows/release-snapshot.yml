name: Release snapshot

# Publishes the -SNAPSHOT from gradle.properties after CI is green on master.
# The release-snapshot environment allows protected branches only, so this job
# always runs from master and reads that environment's secrets.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-snapshot
  cancel-in-progress: false

jobs:
  publish:
    name: Publish snapshot
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    environment: release-snapshot
    steps:
      - uses: actions/checkout@v7

      - name: Skip if master moved past the tested commit
        id: tested
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$TESTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "master is no longer at the tested commit $TESTED_SHA. The newer commit publishes its own snapshot."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tested.outputs.publish == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Publish snapshot
        if: steps.tested.outputs.publish == 'true'
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${version%-SNAPSHOT}" = "$version" ]; then
            echo "Version is $version, not a snapshot. Nothing was published."
            exit 0
          fi
          . .github/workflows/central-credentials.sh
          set +e
          ./gradlew publishToMavenCentral --no-daemon --stacktrace -PtestJavaVersion=21
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Snapshot publish failed."
            echo "HTTP 403 from central.sonatype.com/repository/maven-snapshots means one of:"
            echo "  1. SNAPSHOTs are not enabled for the namespace pl.pojo."
            echo "     Open https://central.sonatype.com/publishing/namespaces,"
            echo "     open the menu on pl.pojo, and choose Enable SNAPSHOTs."
            echo "  2. CENTRAL_TOKEN on the release-snapshot environment is not a user token."
            echo "     Use Account, Generate User Token. A login password is rejected."
            exit "$status"
          fi
          echo "### Snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`pl.pojo:pojo-tester:${version}\`." >> "$GITHUB_STEP_SUMMARY"
