name: Release

# After CI is green on master this waits for a review on release-snapshot,
# publishes the snapshot, then waits on release-ga and publishes the release.
# master stays on a snapshot. The release version comes from -Pversion.
# A tag push does not start this. The tag is created here, after Central accepts it.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Select commit
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$TESTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "master moved past $TESTED_SHA. The newer commit has its own run."
            exit 0
          fi
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          case "$version" in
            *-SNAPSHOT) ;;
            *)
              echo "Version $version is not a snapshot. Nothing was published."
              exit 1
              ;;
          esac
          release=${version%-SNAPSHOT}
          if ! printf '%s' "$release" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Snapshot must be MAJOR.MINOR.PATCH-SNAPSHOT, got $version."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  snapshot:
    name: Publish snapshot
    needs: prepare
    if: needs.prepare.outputs.sha != ''
    runs-on: ubuntu-latest
    environment: release-snapshot
    steps:
      - uses: actions/checkout@v7

      - name: Stay on the tested commit
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "Checked out $(git rev-parse HEAD), expected the tested commit $EXPECTED_SHA."
            exit 1
          fi

      - uses: actions/setup-java@v6
        id: gradle-java
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-java@v6
        id: test-java
        with:
          distribution: temurin
          java-version: 8

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and publish snapshot
        env:
          JAVA_HOME: ${{ steps.gradle-java.outputs.path }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          . .github/workflows/central-credentials.sh
          set +e
          ./gradlew build publishToMavenCentral --no-daemon --stacktrace -PtestJavaVersion=8 -Dorg.gradle.java.installations.paths=${{ steps.test-java.outputs.path }}:${{ steps.gradle-java.outputs.path }}
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Snapshot publish failed."
            echo "HTTP 403 from the snapshot repository means SNAPSHOTs are disabled for pl.pojo,"
            echo "or CENTRAL_TOKEN on release-snapshot is not a Central user token."
            exit "$status"
          fi
          echo "### Snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`pl.pojo:pojo-tester:${VERSION}\`." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release
    needs: [prepare, snapshot]
    if: needs.snapshot.result == 'success'
    runs-on: ubuntu-latest
    environment: release-ga
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stay on the tested commit
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "Checked out $(git rev-parse HEAD), expected the tested commit $EXPECTED_SHA."
            exit 1
          fi

      - uses: actions/setup-java@v6
        id: gradle-java
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-java@v6
        id: test-java
        with:
          distribution: temurin
          java-version: 8

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and publish release
        env:
          JAVA_HOME: ${{ steps.gradle-java.outputs.path }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.release }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          . .github/workflows/central-credentials.sh
          . .github/workflows/signing-key.sh
          ./gradlew build publishAndReleaseToMavenCentral --no-daemon --stacktrace -PtestJavaVersion=8 -Pversion="$VERSION" -Dorg.gradle.java.installations.paths=${{ steps.test-java.outputs.path }}:${{ steps.gradle-java.outputs.path }}
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`pl.pojo:pojo-tester:${VERSION}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.version }}
        run: |
          sha=$(git rev-parse HEAD)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub release ${VERSION} already exists."
          else
            gh release create "$VERSION" \
              --target "$sha" \
              --title "$VERSION" \
              --generate-notes
          fi

      - name: Open pull request for the next snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.version }}
        run: |
          major=${VERSION%%.*}
          rest=${VERSION#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          next="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          current=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "$current" != "$VERSION" ] && [ "$current" != "${VERSION}-SNAPSHOT" ]; then
            echo "gradle.properties is already $current. Not opening a version pull request."
            exit 0
          fi
          branch="chore/snapshot-after-${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          sed -i "s/^version=.*/version=${next}/" gradle.properties
          git add gradle.properties
          git commit -m "Set version to ${next}."
          git push origin "$branch"
          pr=$(gh pr create --base master --head "$branch" \
            --title "Set version to ${next}" \
            --body "Published \`${VERSION}\`. This moves the snapshot line forward.")
          gh pr merge --auto --squash "$pr"
