name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.8.0. Leave empty to publish the current snapshot.'
        required: false
        type: string
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: maven-central-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Publish snapshot
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Publish snapshot
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${version%-SNAPSHOT}" = "$version" ]; then
            echo "Version is $version, not a snapshot. Nothing was published."
            exit 0
          fi
          . .github/workflows/central-credentials.sh
          set +e
          ./gradlew publishToMavenCentral --no-daemon --stacktrace -PtestJavaVersion=21
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Snapshot publish failed."
            echo "HTTP 403 from central.sonatype.com/repository/maven-snapshots means one of:"
            echo "  1. SNAPSHOTs are not enabled for the namespace pl.pojo."
            echo "     Open https://central.sonatype.com/publishing/namespaces,"
            echo "     open the menu on pl.pojo, and choose Enable SNAPSHOTs."
            echo "  2. CENTRAL_TOKEN is not the user token from Account, Generate User Token."
            echo "     The login password and an old OSSRH token are both rejected."
            exit "$status"
          fi

  release:
    name: Publish release
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Publish release
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "A release needs repository secrets SIGNING_KEY and SIGNING_PASSWORD."
            exit 1
          fi
          if [ -n "$INPUT_VERSION" ]; then
            version=$INPUT_VERSION
          else
            version=${GITHUB_REF_NAME#v}
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be MAJOR.MINOR.PATCH, got $version."
            exit 1
          fi
          case "$SIGNING_KEY" in
            *"BEGIN PGP PRIVATE KEY"*)
              export ORG_GRADLE_PROJECT_signingInMemoryKey="$SIGNING_KEY"
              ;;
            *)
              export ORG_GRADLE_PROJECT_signingInMemoryKey="$(printf '%s' "$SIGNING_KEY" | base64 -d)"
              ;;
          esac
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="$SIGNING_PASSWORD"
          . .github/workflows/central-credentials.sh
          ./gradlew build publishAndReleaseToMavenCentral --no-daemon --stacktrace -PtestJavaVersion=21 -Pversion="$version"
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Open pull request for the next snapshot
        env:
          VERSION: ${{ env.version }}
        run: |
          major=${VERSION%%.*}
          rest=${VERSION#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          next="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          current=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "$current" != "$VERSION" ] && [ "$current" != "${VERSION}-SNAPSHOT" ]; then
            echo "gradle.properties is already $current. Not opening a version pull request."
            exit 0
          fi
          branch="chore/snapshot-after-${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          sed -i "s/^version=.*/version=${next}/" gradle.properties
          git add gradle.properties
          git commit -m "Set version to ${next}."
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "Set version to ${next}" \
            --body "Published \`${VERSION}\` from tag \`v${VERSION}\`. This moves the snapshot line forward."
