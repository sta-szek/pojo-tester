name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  administration: read

jobs:
  runner:
    permissions:
      contents: read
      administration: read
    uses: ./.github/workflows/choose-runner.yml
    with:
      allow_self_hosted: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  dependency-review:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure
