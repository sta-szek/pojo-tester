sonar.organization=pojo-tester
sonar.projectKey=sta-szek_pojo-tester
sonar.projectName=pojo-tester
# Scanner CLI 8 ignores sonar.sources and sonar.tests and analyzes the whole
# tree. Drop tests and build output so the coverage number is main code only.
sonar.exclusions=src/test/**,src/integrationTest/**,build/**,.gradle/**,.github/**,gradle/**,src/book/**,**/*.md,**/*.yml,**/*.yaml
sonar.java.binaries=build/classes/java/main
sonar.junit.reportPaths=build/test-results/test,build/test-results/integrationTest
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.sourceEncoding=UTF-8
sonar.java.source=8
