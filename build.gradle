plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'jacoco'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

def testJavaVersion = (findProperty('testJavaVersion') ?: '8') as Integer

dependencies {
    api 'org.slf4j:slf4j-api:2.0.20'
    implementation 'org.apache.commons:commons-lang3:3.22.0'
    implementation 'org.apache.commons:commons-collections4:4.6.0'
    implementation 'com.googlecode.combinatoricslib:combinatoricslib:2.3'
    implementation 'org.javassist:javassist:3.33.0-GA'

    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.20'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.powermock:powermock-reflect:2.0.9'

    // Mockito 5 does not run on Java 8. Each CI job compiles tests against the version it executes.
    if (testJavaVersion <= 8) {
        testImplementation 'org.mockito:mockito-core:4.11.0'
    } else {
        testImplementation 'org.mockito:mockito-core:5.24.0'
    }
}

testing {
    suites {
        integrationTest(JvmTestSuite) {
            useJUnitJupiter('5.14.4')
            dependencies {
                implementation project()
                implementation 'org.apache.commons:commons-lang3:3.22.0'
                compileOnly 'org.projectlombok:lombok:1.18.48'
                annotationProcessor 'org.projectlombok:lombok:1.18.48'
                runtimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
                runtimeOnly 'org.slf4j:slf4j-nop:2.0.20'
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(Test).configureEach {
    def version = JavaLanguageVersion.of(testJavaVersion)
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion.set(version)
    })
    useJUnitPlatform()
    if (testJavaVersion >= 9) {
        jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.util.function=ALL-UNNAMED',
                '--add-opens=java.base/java.time=ALL-UNNAMED'
    }
    if (testJavaVersion >= 21) {
        jvmArgs '-XX:+EnableDynamicAgentLoading'
    }
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

tasks.named('integrationTest') {
    mustRunAfter tasks.named('test')
}

jacoco {
    toolVersion = '0.8.14'
}

// Unit and integration test coverage merged into one report .
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec'))
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    finalizedBy tasks.named('jacocoTestReport')
}

pitest {
    targetClasses = ['pl.pojo.tester.*']
    pitestVersion = '1.30.2'
    junit5PluginVersion = '1.2.3'
    threads = 4
    timestampedReports = false
    outputFormats = ['XML', 'HTML']
    failWhenNoMutations = true
    timeoutConstInMillis = 20000
    timeoutFactor = 1.5
    jvmArgs = ['--add-opens=java.base/java.lang=ALL-UNNAMED',
               '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
               '--add-opens=java.base/java.util=ALL-UNNAMED',
               '--add-opens=java.base/java.util.function=ALL-UNNAMED',
               '--add-opens=java.base/java.time=ALL-UNNAMED']
}

mavenPublishing {
    publishToMavenCentral()
    if (findProperty('signingInMemoryKey')) {
        signAllPublications()
    }
    pom {
        name = 'pojo-tester'
        description = 'Java pojo-methods testing library.'
        url = 'https://github.com/sta-szek/pojo-tester'
        licenses {
            license {
                name = 'GNU Lesser General Public License version 3'
                url = 'https://opensource.org/licenses/lgpl-3.0.html'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'sta-szek'
                name = 'Piotr Joński'
                email = 'p.jonski@pojo.pl'
            }
        }
        scm {
            url = 'https://github.com/sta-szek/pojo-tester'
            connection = 'scm:git:https://github.com/sta-szek/pojo-tester.git'
            developerConnection = 'scm:git:ssh://git@github.com/sta-szek/pojo-tester.git'
        }
    }
}
